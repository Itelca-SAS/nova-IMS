# Configuración del análisis automático de SonarCloud (rutas relativas a la raíz del repositorio).
# Las exclusiones por regla (sonar.issue.ignore.multicriteria) no se admiten aquí:
# se configuran en SonarCloud → Administration → General Settings → Analysis Scope.

sonar.sourceEncoding=UTF-8

sonar.sources=Nova-IMS/backend,Nova-IMS/frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/.angular/**,**/coverage/**,**/sql/**,**/*.sql,Nova-IMS/backend/scripts/**,Nova-IMS/backend/views/**,Nova-IMS/backend/test/**,**/*.spec.ts,**/*.test.js,**/*.spec.js

sonar.tests=Nova-IMS/backend/test,Nova-IMS/frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.js,**/*.spec.js
